# CI für prototypen — smoke-Teste für beide lauffähigen Samples.

name: protypen-smoke

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    # gw-shared-lib (6 Bausteine, stdlib, kein Build) ist in
    #   vendor/gw_shared_lib/ vendorisiert. PYTHONPATH zeigt auf vendor/,
    #   damit import gw_shared_lib ohne Netz, ohne pip, ohne Secret
    #   funktioniert. Kein public-Abhaengigkeit.
    env:
      PYTHONPATH: "${{ github.workspace }}/vendor"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # DRIFT-GUARD: vendor/ ist ein Snapshot von GRADweight/shared-lib v0.1.1.
      # CANONICAL-Invariant: guard.INJECTION_SIGNATURES == 16. Abweichung =>
      # rot => vendor/ muss von shared-lib neu synchronisiert + SNAPSHOT
      # aktualisiert werden (kein stiller Drift in den CANONICAL-State).
      - name: Vendor drift-guard (CANONICAL-Pruefung)
        run: |
          [ -d vendor/gw_shared_lib ] || { echo "vendor/gw_shared_lib fehlt — von shared-lib neu kopieren"; exit 1; }
          python3 -c "import sys; sys.path.insert(0,'vendor'); from gw_shared_lib.guard import INJECTION_SIGNATURES as s; assert len(s)==16, f'DRIFT: signatures={len(s)} != 16'; print('OK: INJECTION_SIGNATURES =', len(s), '(CANONICAL)')"

      - name: Compile check
        run: |
          python -m compileall -q \
            prototypes/01-rag-chatbot/code/ \
            prototypes/02-rechnungs-extraktion/code/

      - name: RAG-Chatbot smoke (offline, kein Netz)
        run: |
          cd prototypes/01-rag-chatbot
          python3 code/main.py "Wie viele Ferientage habe ich im ersten Dienstjahr?"
          # erwarteter Output: STATUS: OK

      - name: Rechnungs-Extraktion smoke (offline)
        run: |
          cd prototypes/02-rechnungs-extraktion
          python3 code/main.py
          # erwarteter Output: STATUS: OK

      # --- GW-PROTO PRODUCTION-GATE (NEU, M2) ---
      # Der Gleiche Gate für alle Prototypen: Dual-Orakel (DEMO=Stub offline /
      # PROD=echtes Modell) + Delta + GO/NO-GO. In CI (kein Ollama) läuft der
      # PROD-Orakel offline => jeder Prototyp, der ein online-Modell braucht,
      # gibt ehrlich CONDITIONAL (nicht GO). Deterministische Domänen (Extraktion)
      # geben GO. Das ist der ehrliche Zustand — kein vorgetäuschter Erfolg.
      - name: "gw_proto production-gate (offline, ehrlich)"
        run: |
          python -m gw_proto prototypes/01-rag-chatbot/manifest.json --no-prod --artifact artifacts/01-rag-chatbot/verdict.json --audit .audit/ci-gate.jsonl || true
          python -m gw_proto prototypes/02-rechnungs-extraktion/manifest.json --artifact artifacts/02-rechnungs-extraktion/verdict.json --audit .audit/ci-gate.jsonl
          python -m gw_proto prototypes/03-email-triage/manifest.json --artifact artifacts/03-email-triage/verdict.json --audit .audit/ci-gate.jsonl
          python -m gw_proto prototypes/04-kundensupport-chatbot/manifest.json --no-prod --artifact artifacts/04-kundensupport-chatbot/verdict.json --audit .audit/ci-gate.jsonl || true
          python -m gw_proto prototypes/05-offerten-generator/manifest.json --artifact artifacts/05-offerten-generator/verdict.json --audit .audit/ci-gate.jsonl
          python -m gw_proto prototypes/06-intranet-wissenssuche/manifest.json --no-prod --artifact artifacts/06-intranet-wissenssuche/verdict.json --audit .audit/ci-gate.jsonl || true
          echo "=== Verdicts ==="
          for f in artifacts/*/verdict.json; do echo "--- $f ---"; cat "$f"; done

      - name: Audit-Trail (JSONL)
        if: always()
        run: |
          echo "=== CI Gate-Audit (letzten 10 Einträge) ==="
          tail -n 10 .audit/ci-gate.jsonl 2>/dev/null || true


      # Alternativ: Wenn SHARED_LIB_TOKEN als GitHub Secret gesetzt ist,
      # kann gw-shared-lib direkt per pip installiert werden.
