# CI für prototypen — smoke-Teste für beide lauffähigen Samples.

name: prototypen-smoke

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.11', '3.12']
    # 2026-10-21 Fix (Q1: shared-lib bleibt in Wave 1 PRIVAT):
    # Der alte Schritt 'pip install git+https://github.com/GRADweight/shared-lib'
    # lieferte 404 (privates Repo, kein Auth). Aenderung (2): path muss INNERHALB
    # des workspaces liegen (../shared-lib wurde von actions/checkout abgewiesen:
    # "Repository path ... is not under .../prototypen"). Kein pip-build notig,
    # weil shared-lib reine Module ist und PYTHONPATH den Import liefert
    # (pyproject build-backend ist nicht relevant). Kein Netz-Pip, kein
    # public-Abhaengigkeit.
    env:
      PYTHONPATH: "${{ github.workspace }}/_shared-lib"
    steps:
      - uses: actions/checkout@v4

      # 2. Checkout: CANONICAL-Fundament shared-lib (privates Org-Repo).
      # path INSIDE workspace. Pin an Tag = reproduzierbar.
      # Bei shared-lib v0.2.x: ref hier erhoehen.
      - name: Checkout shared-lib (privat, CANONICAL-Fundament)
        uses: actions/checkout@v4
        with:
          repository: GRADweight/shared-lib
          ref: v0.1.0
          path: _shared-lib

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Compile check
        run: |
          python -m compileall -q \
            prototypes/01-rag-chatbot/code/ \
            prototypes/02-rechnungs-extraktion/code/

      - name: RAG-Chatbot smoke (offline, kein Netz)
        run: |
          cd prototypes/01-rag-chatbot
          python3 code/main.py "Wie viele Ferientage habe ich im ersten Dienstjahr?"
          # erwarteter Output: STATUS: OK

      - name: Rechnungs-Extraktion smoke (offline)
        run: |
          cd prototypes/02-rechnungs-extraktion
          python3 code/main.py
          # erwarteter Output: STATUS: OK
